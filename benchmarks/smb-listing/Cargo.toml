# Standalone bench, kept out of the library workspace (like benchmarks/smb).
# The empty [workspace] table makes this manifest its own workspace root.
[workspace]

[package]
name = "smb-listing-probe"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "smb-listing-probe"
path = "src/main.rs"

[dependencies]
smb2 = { path = "../../crates/smb2" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "1"
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
