# Security audit: `cargo audit` and `cargo deny check`, the same two gates as `just audit` and `just deny`.
#
# One definition, two callers: `ci.yml` calls it on every push and PR (gated by `CI OK`), and the schedule here runs it
# daily, so an advisory published against a crate already in Cargo.lock fails a run without waiting for a push.

name: Security Audit

on:
  schedule:
    # Daily at 4 AM UTC, like mtp-rs.
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  audit:
    name: Security audit (cargo-audit, cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      # Reads `.cargo/audit.toml`. `--deny warnings` also fails on unmaintained and unsound crates, like `just audit`.
      - name: Run cargo audit
        run: cargo audit --deny warnings

      # Reads `deny.toml`: advisories (with `unused-ignored-advisory = "deny"`), licenses, bans, and sources.
      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check
          log-level: warn
