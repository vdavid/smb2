name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }}, rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]
        # Tests, examples, and lints run on stable only, so dev-dependencies are free to need newer Rust.
        # What consumers build is checked on the MSRV by the `msrv` job.
        rust: [stable]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy lints
        run: cargo clippy --all-targets -- -D warnings

      # No tokio reactor compiled in: proves nothing outside `src/rt/` reaches for tokio's runtime.
      - name: Run clippy on a smol-only build
        run: cargo clippy -p smb2 --no-default-features --features smol --lib --examples -- -D warnings

      - name: Run tests
        run: cargo test

      # Both runtimes compiled in: the tokio suite stays on tokio, and the smol tests run with no tokio runtime.
      - name: Run tests with the smol backend
        run: cargo test -p smb2 --features smol --lib

      - name: Build documentation
        run: cargo doc --no-deps

  docker-tests:
    name: Docker integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Start SMB containers
        run: ./crates/smb2/tests/docker/start.sh internal

      - name: Run Docker integration tests
        run: cargo test -p smb2 --test docker_integration -- --ignored
        env:
          RUST_LOG: smb2=info

      - name: Run Docker integration tests on smol
        run: cargo test -p smb2 --no-default-features --features smol --test smol_integration -- --ignored
        env:
          RUST_LOG: smb2=info

      - name: Stop containers
        if: always()
        run: ./crates/smb2/tests/docker/stop.sh

  cli-e2e-tests:
    name: CLI end-to-end tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      # Only smb-auth and smb-fruit: the CLI suite needs two fixtures, not all 16 (same as `just test-cli-e2e`).
      - name: Start the SMB fixtures
        run: ./crates/smb2/tests/docker/start.sh internal smb-auth smb-fruit

      - name: Run CLI end-to-end tests
        run: cargo test -p smb2-cli --test e2e -- --ignored
        env:
          RUST_LOG: smb2=info

      - name: Stop containers
        if: always()
        run: ./crates/smb2/tests/docker/stop.sh

  consumer-tests:
    name: Consumer integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Start consumer containers
        run: ./crates/smb2/tests/docker/start.sh consumer

      - name: Run consumer integration tests
        run: cargo test -p smb2 --features testing --test consumer_integration -- --ignored
        env:
          RUST_LOG: smb2=info

      - name: Stop containers
        if: always()
        run: ./crates/smb2/tests/docker/stop.sh

  # The MSRV promise covers what a consumer compiles: the library (every feature) and the CLI binary. Tests and
  # dev-dependencies are ours alone, so they're held to stable, not to the MSRV. Each OS, for the `cfg`-gated code.
  # It resolves dependencies afresh the way a consumer on the MSRV does, so the committed Cargo.lock (kept current by
  # Renovate) never has to stay MSRV-compatible. See docs/dependency-updates.md.
  msrv:
    name: Verify MSRV (1.91, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2025]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          # Keep in sync with rust-version in Cargo.toml. Renovate leaves it alone on purpose.
          toolchain: "1.91"

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Resolve dependencies like a consumer on the MSRV
        # `fallback` makes the resolver pick the newest version whose rust-version fits ours.
        run: cargo update
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback

      - name: Check compilation on MSRV
        run: cargo check
        env:
          RUSTFLAGS: "-D warnings"

      - name: Check every library feature on MSRV
        run: cargo check -p smb2 --all-features
        env:
          RUSTFLAGS: "-D warnings"

      - name: Check the smol-only build on MSRV
        run: cargo check -p smb2 --no-default-features --features smol
        env:
          RUSTFLAGS: "-D warnings"

  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [check, docker-tests, cli-e2e-tests, consumer-tests, msrv]
    if: always()
    steps:
      - name: Check all jobs passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Don't trust `needs.*.result`: it can't see individual matrix legs.
          # GitHub aggregates a matrix into one result, and legs cancelled because
          # a hosted runner was never acquired can aggregate to SUCCESS (run
          # 29009362774: four macOS/Windows legs queued 15 min, were cancelled,
          # and the old expression-based gate passed). Ask the API for every job
          # in this run instead and require each one (except this gate) to have
          # concluded success or skipped.
          not_green=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name != "CI OK") | select(.conclusion != null) | select(.conclusion != "success" and .conclusion != "skipped") | "\(.name): \(.conclusion)"] | .[]')
          if [[ -n "$not_green" ]]; then
            echo "Jobs not green:"
            echo "$not_green"
            exit 1
          fi
          echo "All jobs passed"
