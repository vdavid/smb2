[package]
name = "smb2-cli"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line SMB2/3 client: list, stat, move, and delete files on a share without mounting it"
keywords = ["smb", "smb2", "smb3", "cifs", "cli"]
categories = ["command-line-utilities", "network-programming", "filesystem"]
readme = "README.md"
documentation = "https://docs.rs/smb2-cli"

exclude = [
    # Agent tooling, not source a consumer installing the binary wants. Restored
    # after the move into the workspace dropped it: the package root changed, so
    # the list that used to sit beside these files stopped covering them.
    "AGENTS.md",
    # Root-anchored: this one is only an `@AGENTS.md` import, and `AGENTS.md` is
    # excluded above, so shipping it would publish a pointer to a file that
    # isn't in the package.
    "/CLAUDE.md",
    ".claude/",
    # Dev-only, same reasoning as the library's: the e2e suite can't run from a
    # published tarball anyway, since its Samba fixtures live in the repo.
    "tests/",
]

[[bin]]
name = "smb2"
path = "src/main.rs"
# The binary is called `smb2` and so is the library crate, so rustdoc wants to
# write both into `target/doc/smb2/`. A workspace `cargo doc` then races itself
# and one of the two fails with "failed to remove directory ... Directory not
# empty" (rust-lang/cargo#6313), which is a coin flip per run rather than a
# reliable break. Nobody reads rustdoc for a binary anyway; `--help` is its
# interface.
doc = false

[dependencies]
# `version` + `path`: the path is what a workspace build uses, and `cargo
# publish` rewrites the dependency to the bare version. Keep the version equal
# to the library's current one -- a stale number here is a publish-time error
# rather than a CLI that silently ships against an old library.
smb2 = { version = "0.24.0", path = "../smb2" }

anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive", "env"] }
env_logger = "0.11.11"
rpassword = "7.5.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-std", "io-util", "sync"] }
