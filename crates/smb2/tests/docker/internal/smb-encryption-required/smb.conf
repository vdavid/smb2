[global]
server min protocol = SMB3_00
server max protocol = SMB3_11
# Global "required": a client that does not negotiate encryption is refused at
# session setup ("reject session ... as encryption is required").
server smb encrypt = required
log level = 1

[private]
path = /shares/private
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777
