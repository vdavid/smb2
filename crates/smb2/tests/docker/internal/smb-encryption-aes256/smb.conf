[global]
server min protocol = SMB3_11
server max protocol = SMB3_11
# AES-256-GCM only, and encryption NOT required for the session: every
# session on this server negotiates an AES-256 cipher, so it has to sign with
# a 128-bit key whether or not anything gets encrypted (issue #32).
server smb3 encryption algorithms = AES-256-GCM
log level = 1

# Plaintext: proves an AES-256 session signs correctly.
[private]
path = /shares/private
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777

# Share-level "required": TREE_CONNECT sets SMB2_SHAREFLAG_ENCRYPT_DATA, and
# everything after it is AES-256-GCM.
[encrypted]
path = /shares/encrypted
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777
smb encrypt = required
