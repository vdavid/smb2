[global]
server min protocol = SMB3_11
server max protocol = SMB3_11
# The one cipher nothing else here negotiates: 256-bit keys with CCM's
# 11-byte nonce. Required for the whole session.
server smb3 encryption algorithms = AES-256-CCM
server smb encrypt = required
log level = 1

[private]
path = /shares/private
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777
