# Two root targets, the first of them unreachable.
#
# `msdfs proxy` takes a comma-separated list and Samba returns the entries in
# configured order, so this pins multi-target failover: a client that stops at
# the first target never reaches the files.
[global]
workgroup = TESTGROUP
server string = DFS Failover
log level = 1
map to guest = Bad User
server min protocol = SMB2_02
host msdfs = yes

[aleu]
path = /srv/empty
msdfs root = yes
msdfs proxy = \nosuchhost\files,\smb-dfs-target\files
guest ok = yes
read only = no
