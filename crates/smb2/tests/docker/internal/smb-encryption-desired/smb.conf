[global]
# Samba's default dialects (2.0.2 to 3.1.1) with encryption preferred, not
# required: a client that negotiates a cipher is told to encrypt, one that
# doesn't is served in the clear. That's what a rewritten NEGOTIATE (3.1.1 and
# the ENCRYPTION capability taken out) can talk this server into, so the
# negotiation check and `require_encryption` are tested against it.
server min protocol = SMB2_02
server max protocol = SMB3_11
server smb encrypt = desired
log level = 1

[private]
path = /shares/private
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777
