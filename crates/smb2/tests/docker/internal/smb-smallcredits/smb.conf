[global]
server min protocol = SMB2_02
server max protocol = SMB3_11
map to guest = Bad User
log level = 1
# A credit window far smaller than one MaxReadSize READ (8 MiB, 128 credits),
# the profile of embedded NAS firmware: a request charging more than this can
# never be funded, and Samba cuts the connection on one that arrives anyway.
smb2 max credits = 64

[public]
path = /shares/public
read only = no
guest ok = yes
browseable = yes
create mask = 0666
directory mask = 0777
