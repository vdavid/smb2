# Every port publishes to 127.0.0.1, not 0.0.0.0. Without the `${SMB_BIND_ADDR}` prefix, Docker binds
# all interfaces, putting 14 Samba servers (guest shares included) on the LAN and tailnet of whoever
# runs the tests. The fixtures hold no real data, but an unauthenticated smbd reachable from the local
# network is surface nobody asked for.
#
# Set SMB_BIND_ADDR=0.0.0.0 to reach the fixtures from another machine or a NAT'd VM (a guest VM hits
# the host through a gateway IP, not loopback, so localhost binding is invisible to it).
services:
  smb-guest:
    build:
      context: smb-guest
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10445:445"

  smb-auth:
    build:
      context: smb-auth
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10446:445"

  smb-signing:
    build:
      context: smb-signing
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10447:445"

  smb-readonly:
    build:
      context: smb-readonly
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10448:445"

  smb-ancient:
    build:
      context: smb-ancient
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10449:445"

  smb-flaky:
    build:
      context: smb-flaky
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10450:445"

  smb-slow:
    build:
      context: smb-slow
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10451:445"
    cap_add:
      - NET_ADMIN

  smb-encryption:
    build:
      context: smb-encryption
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10452:445"

  smb-encryption-aes128:
    build:
      context: smb-encryption-aes128
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10455:445"

  smb-50shares:
    build:
      context: smb-50shares
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10453:445"

  smb-manyshares:
    build:
      context: smb-manyshares
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10458:445"

  smb-maxreadsize:
    build:
      context: smb-maxreadsize
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10454:445"

  smb-weirdnames:
    build:
      context: smb-weirdnames
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10459:445"

  smb-dfs-root:
    build:
      context: smb-dfs-root
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10456:445"

  smb-dfs-target:
    build:
      context: smb-dfs-target
    ports:
      - "${SMB_BIND_ADDR:-127.0.0.1}:10457:445"
