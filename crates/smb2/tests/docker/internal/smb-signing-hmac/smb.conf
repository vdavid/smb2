# Issue #33: SMB 3.1.1 signed with HMAC-SHA256, the one algorithm this server
# accepts. The client offers it in SMB2_SIGNING_CAPABILITIES, the server picks
# it, and every signed frame after NEGOTIATE has to use it.
[global]
server min protocol = SMB3_11
server max protocol = SMB3_11
server signing = mandatory
server smb3 signing algorithms = HMAC-SHA256
log level = 1

[private]
path = /shares/private
read only = no
valid users = testuser
browseable = yes
create mask = 0666
directory mask = 0777
