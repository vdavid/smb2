# A DFS *namespace root*: a name that is not a tree-connectable share.
#
# `msdfs proxy` makes smbd refuse TREE_CONNECT outright ("refusing connection
# to dfs proxy share") with STATUS_BAD_NETWORK_NAME, and answer
# FSCTL_DFS_GET_REFERRALS over IPC$ with a V3 root referral naming the proxy
# target. That is the field shape a domain-based namespace has, and the
# reactive `STATUS_PATH_NOT_COVERED` path can never reach it.
#
# `smb-dfs-root` (10456) stays the *link* fixture and is a real share; this is
# deliberately the other shape.
[global]
workgroup = TESTGROUP
server string = DFS Namespace
log level = 1
map to guest = Bad User
server min protocol = SMB2_02
host msdfs = yes

[aleu]
path = /srv/empty
msdfs root = yes
msdfs proxy = \smb-dfs-target\files
guest ok = yes
read only = no

# A real share beside it, so a test can prove an ordinary tree connect to this
# same server still works and costs nothing extra.
[plain]
path = /srv/plain
guest ok = yes
read only = no
