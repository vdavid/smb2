[global]
server min protocol = SMB2_02
server max protocol = SMB3_11
map to guest = Bad User
log level = 1
# The whole point of this container is what bytes land in a filename, so pin
# the charset instead of inheriting whatever the base image defaults to.
unix charset = UTF-8

[public]
path = /shares/public
read only = no
guest ok = yes
browseable = yes
create mask = 0666
directory mask = 0777
