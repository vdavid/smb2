[workspace]
resolver = "2"
members = ["crates/smb2"]
# benchmarks/smb excluded: sspi crate pins digest =0.11.0-rc.5 which conflicts with digest 0.11.2.
# benchmarks/smb-listing excluded to keep it a standalone bench (like benchmarks/smb), independent of the library's lockfile.
exclude = ["benchmarks/smb", "benchmarks/smb-listing"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vdavid/smb2"
